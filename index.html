<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON to Plain Text Converter</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 220px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      resize: vertical;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      background: #00b894;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    #output {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #444;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 120px;
    }
  </style>
</head>

<body>

  <h1>JSON → Plain Text Converter</h1>

  <textarea id="jsonInput" placeholder="Paste your JSON here..."></textarea>

  <div class="buttons">
    <button onclick="convertJSON()">Convert</button>
    <button onclick="copyText()">Copy Output</button>
    <button onclick="clearAll()">Clear</button>
  </div>

  <div id="output">Converted text will appear here...</div>

  <script>
    function convertJSON() {
      try {
        const data = JSON.parse(document.getElementById("jsonInput").value);

        let result = "";

        function extract(obj, indent = "") {
          for (let key in obj) {

            let value = obj[key];

            if (
              value === null ||
              value === "" ||
              value === "N/A" ||
              value === "NA"
            ) {
              continue;
            }

            key = key.replace(/_/g, " ");

            if (typeof value === "object" && value !== null) {
              result += `${indent}${key.toUpperCase()}:\n`;
              extract(value, indent + "  ");
            } else {
              result += `${indent}${key}: ${value}\n`;
            }
          }
        }

        extract(data);

        document.getElementById("output").textContent = result;

      } catch (error) {
        document.getElementById("output").textContent =
          "❌ Invalid JSON format!";
      }
    }

    function copyText() {
      const output = document.getElementById("output").textContent;

      navigator.clipboard.writeText(output)
        .then(() => {
          alert("✅ Copied to clipboard!");
        })
        .catch(() => {
          alert("❌ Failed to copy!");
        });
    }

    function clearAll() {
      document.getElementById("jsonInput").value = "";
      document.getElementById("output").textContent =
        "Converted text will appear here...";
    }
  </script>

</body>

function convertJSON() {
  try {
    const data = JSON.parse(document.getElementById("jsonInput").value);

    let text = "";

    function extract(obj, indent = "") {
      for (let key in obj) {
        if (typeof obj[key] === "object" && obj[key] !== null) {
          text += `${indent}${key}:\n`;
          extract(obj[key], indent + "  ");
        } else {
          text += `${indent}${key}: ${obj[key]}\n`;
        }
      }
    }

    extract(data);

    document.getElementById("output").textContent = text;

  } catch (err) {
