<!DOCTYPE html>
<html>
<head>
  <title>JSON to Plain Text</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 200px;
      margin-bottom: 15px;
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 10px;
    }

    button {
      padding: 10px 20px;
      background: #00b894;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    pre {
      background: #222;
      padding: 15px;
      white-space: pre-wrap;
      margin-top: 20px;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

<h2>JSON → Plain Text Converter</h2>

<textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>

<button onclick="convertJSON()">Convert</button>

<pre id="output"></pre>

<script>
function convertJSON() {
  try {
    const data = JSON.parse(document.getElementById("jsonInput").value);

    let text = "";

    function extract(obj, indent = "") {
      for (let key in obj) {
        if (typeof obj[key] === "object" && obj[key] !== null) {
          text += `${indent}${key}:\n`;
          extract(obj[key], indent + "  ");
        } else {
          text += `${indent}${key}: ${obj[key]}\n`;
        }
      }
    }

    extract(data);

    document.getElementById("output").textContent = text;

  } catch (err) {
    document.getElementById("output").textContent = "Invalid JSON!";
  }
}
</script>

</body>
</html>
